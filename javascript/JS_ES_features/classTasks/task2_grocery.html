<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Processing</title>
    <link rel="stylesheet" href="task2.css">
</head>
<body>
    <div class="container">
        <h2>E-Commerce Order Processing</h2>
        <label>Product Price:</label>
        <input type="text" id="price" placeholder="Enter price">

        <label>Quantity:</label>
        <input type="text" id="qty" placeholder="Enter quantity">

        <label>Delivery Day (1-7):</label>
        <input type="text" id="day" placeholder="Enter day number">

        <button onclick="processOrder()">Calculate Bill</button>

        <pre id="output"></pre>
    </div>

    <script src="task2_grocery.js"></script>
</body>
</html>
